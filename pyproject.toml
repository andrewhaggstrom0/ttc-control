[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ttc-control"
version = "0.1.0"
description = "Test-time compute scaling for control policies"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "mujoco>=3.1",
    "gymnasium>=0.29",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ipython"]

[tool.setuptools.packages.find]
include = ["ttc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
